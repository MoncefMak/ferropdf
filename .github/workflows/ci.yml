name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.8", "3.11", "3.12", "3.13"]
        exclude:
          # ubuntu-latest (26.04) no longer ships Python 3.8; 3.8 stays
          # covered on macOS and Windows.
          - os: ubuntu-latest
            python-version: "3.8"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Rust tests
        run: cargo test --no-default-features

      - name: Build and install
        run: |
          python -m venv .venv
          source .venv/bin/activate 2>/dev/null || source .venv/Scripts/activate
          pip install maturin pytest pytest-cov pypdf pymupdf pytest-github-actions-annotate-failures
          maturin develop --release
        shell: bash

      - name: Python tests
        run: |
          source .venv/bin/activate 2>/dev/null || source .venv/Scripts/activate
          pytest tests/ -v --tb=short
        shell: bash

  visual:
    # Pixel comparison of the template corpus against tests/corpus/reference.
    # Linux only: references depend on the DejaVu fonts and the rasteriser.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install fonts
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends fonts-dejavu-core fonts-dejavu-extra
      - name: Build and install
        run: |
          python -m venv .venv
          source .venv/bin/activate
          pip install maturin pytest pypdf pymupdf pillow
          maturin develop --release
      - name: Visual regression
        run: |
          source .venv/bin/activate
          FERROPDF_VISUAL=1 pytest tests/test_visual.py -v --tb=line
      - name: Upload diffs
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: visual-diffs
          path: tests/corpus/_output
          retention-days: 14

  pdfa:
    # PDF/A conformance of generated files (tests/pdfa/make_corpus.py),
    # checked by veraPDF, the reference validator.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install fonts
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends fonts-dejavu-core fonts-dejavu-extra
      - name: Build and install
        run: |
          python -m venv .venv
          source .venv/bin/activate
          pip install maturin
          maturin develop --release
      - name: Generate PDF/A files
        run: |
          source .venv/bin/activate
          python tests/pdfa/make_corpus.py pdfa-out
      - name: veraPDF
        working-directory: pdfa-out
        run: |
          docker pull -q verapdf/cli:v1.28.2
          : > report.txt
          for flavour in 2b 3b; do
            files=$(ls *-"$flavour".pdf | sed 's|^|/data/|')
            docker run --rm -v "$PWD:/data" verapdf/cli:v1.28.2 \
              --flavour "$flavour" --format text --verbose $files | tee -a report.txt || true
          done
          total=$(ls *.pdf | wc -l)
          passed=$(grep -c '^PASS' report.txt || true)
          echo "veraPDF: $passed / $total files pass"
          test "$passed" -eq "$total"
      - name: Upload PDF/A files
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: pdfa-files
          path: pdfa-out
          retention-days: 14

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          components: clippy, rustfmt
      - name: Format check
        run: cargo fmt --all --check
      - name: Clippy
        # --all-targets lints tests, benches and examples too.
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Security audit
        run: |
          cargo install cargo-audit --quiet 2>/dev/null || true
          cargo audit
