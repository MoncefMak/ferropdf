name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.8", "3.11", "3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Rust tests
        run: cargo test --no-default-features

      - name: Build and install
        run: |
          python -m venv .venv
          source .venv/bin/activate 2>/dev/null || source .venv/Scripts/activate
          pip install maturin pytest pytest-cov pypdf pymupdf pytest-github-actions-annotate-failures
          maturin develop --release
        shell: bash

      - name: Python tests
        run: |
          source .venv/bin/activate 2>/dev/null || source .venv/Scripts/activate
          pytest tests/ -v --tb=short
        shell: bash

  visual:
    # Pixel comparison of the template corpus against tests/corpus/reference.
    # Linux only: references depend on the DejaVu fonts and the rasteriser.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install fonts
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends fonts-dejavu-core fonts-dejavu-extra
      - name: Build and install
        run: |
          python -m venv .venv
          source .venv/bin/activate
          pip install maturin pytest pypdf pymupdf pillow
          maturin develop --release
      - name: Visual regression
        run: |
          source .venv/bin/activate
          FERROPDF_VISUAL=1 pytest tests/test_visual.py -v --tb=line
      - name: Upload diffs
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: visual-diffs
          path: tests/corpus/_output
          retention-days: 14

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          components: clippy, rustfmt
      - name: Format check
        run: cargo fmt --all --check
      - name: Clippy
        # --all-targets lints tests, benches and examples too.
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Security audit
        run: |
          cargo install cargo-audit --quiet 2>/dev/null || true
          cargo audit
