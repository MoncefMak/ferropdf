<!DOCTYPE html>
<html>
  <body style="margin:0; background:#f4f4f7;">
    <style>
      .wrapper { width: 100%; background: #f4f4f7; padding: 24px 0; }
      .content { width: 520px; margin: 0 auto; background: #ffffff; border-radius: 6px; }
      .inner { padding: 32px; font-family: "DejaVu Sans", Helvetica, Arial, sans-serif; color: #51545e; font-size: 14px; line-height: 1.6; }
      h1 { color: #333333; font-size: 20px; margin-top: 0; }
      .button { display: inline-block; background: #3869d4; color: #ffffff; padding: 10px 18px;
                border-radius: 3px; text-decoration: none; }
      .footer { text-align: center; font-size: 11px; color: #a8aaaf; padding: 16px; }
    </style>
    <table class="wrapper" cellpadding="0" cellspacing="0">
      <tr>
        <td>
          <table class="content" cellpadding="0" cellspacing="0">
            <tr>
              <td class="inner">
                <h1>Your order has shipped</h1>
                <p>
                  Hi Sofia,
                </p>
                <p>
                  Good news — order <strong>#58213</strong> left our warehouse today
                  and should arrive by <strong>Friday, 30 October</strong>.
                </p>
                <p>
                  <a class="button" href="https://shop.example/track/58213">Track your parcel</a>
                </p>
                <p>
                  Thanks for shopping with us,<br>
                  The Example Shop team
                </p>
              </td>
            </tr>
          </table>
          <div class="footer">
            Example Shop · 1 Harbour Road · Dublin
          </div>
        </td>
      </tr>
    </table>
  </body>
</html>
